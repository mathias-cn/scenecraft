[tool.poetry]
name = "scenecraft-backend"
version = "0.1.0"
description = "SceneCraft — geração automatizada de vídeos para YouTube"
authors = ["SceneCraft"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
celery = { extras = ["redis"], version = "^5.4.0" }
redis = "^5.2.0"
sqlalchemy = "^2.0.36"
psycopg2-binary = "^2.9.10"
pydantic-settings = "^2.6.1"
python-multipart = "^0.0.17"
httpx = "^0.27.2"
boto3 = "^1.35.0"
alembic = "^1.14.0"
openai = "^1.51.0"
# YouTube quebra nsig com frequência: atualize yt-dlp mensalmente e mantenha Deno no PATH.
# yt-dlp-ejs resolve nsig no client web; o extra deno não substitui o binário no container.
yt-dlp = { extras = ["default", "deno", "curl-cffi"], version = ">=2026.8.19" }
yt-dlp-ejs = ">=0.8.0"
# Legendas oficiais (youtube_link) antes de baixar áudio; Whisper só como fallback.
youtube-transcript-api = "^1.2.3"
pydub = "^0.25.1"
pillow = "^11.0.0"
pyjwt = {extras = ["crypto"], version = "^2.13.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
ruff = "^0.8.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
